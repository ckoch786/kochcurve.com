title: Cory Koch | Software Engineer
email: your.email@example.com
description: >-
  A personal blog about software engineering, cloud architecture,
  and modern development practices.
baseurl: ""
url: "https://yourusername.github.io"
github_username: ckoch786
linkedin_username: cory-koch

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Cory Koch"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
